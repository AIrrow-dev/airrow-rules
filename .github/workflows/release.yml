name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stable bundle
        run: python scripts/build_bundle.py --output bundle/stable.bundle.json

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-bundle
          path: bundle/stable.bundle.json

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" bundle/stable.bundle.json --title "${GITHUB_REF_NAME}" --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" bundle/stable.bundle.json --clobber
